# tdxl-pwa 同源反代（PWA 静态 + WebDAV /dav/）
# 部署在飞牛 NAS Docker，解决浏览器跨域直连 WebDAV 无 CORS 的问题
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WebDAV 同源反代：/dav/* → 飞牛内置 WebDAV 的同步目录（URL 编码的中文路径 /业务/tdxl-sync/）
    location /dav/ {
        proxy_pass http://192.168.31.239:5005/%E4%B8%9A%E5%8A%A1/tdxl-sync/;
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        # WebDAV 方法全放行；上传词库/流水载荷上限给足
        client_max_body_size 32m;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # Service Worker 必须每次校验，否则更新机制失灵
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # 带内容哈希的静态资源长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 兜底（PWA navigateFallback 由 SW 处理，这里兜直连刷新）
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types application/json application/javascript text/css application/manifest+json;
}
