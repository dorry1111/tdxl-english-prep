workflows:
  build-ios-ipa:
    name: Build iOS IPA (unsigned for 全能签)
    max_build_duration: 30
    environment:
      node: 22.0.0
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Build web assets (vite -> dist)
        script: |
          npm run build
      - name: Sync Capacitor iOS platform
        script: |
          npx cap sync ios
      - name: Build unsigned IPA (签名交给全能签)
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -target App -configuration Release \
            -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          mkdir -p build/Payload
          cp -r "build/App.xcarchive/Products/Applications/App.app" build/Payload/
          cd build && zip -r "$CM_EXPORT_DIR/tdxl-english-prep.ipa" Payload
    artifacts:
      - $CM_EXPORT_DIR/tdxl-english-prep.ipa
