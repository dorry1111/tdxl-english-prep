workflows:
  build-ios-ipa:
    name: Build iOS IPA (unsigned for 全能签)
    max_build_duration: 30
    environment:
      node: 22.0.0
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Build web assets (vite -> dist)
        script: |
          npm run build
      - name: Sync Capacitor iOS platform
        script: |
          npx cap sync ios
      - name: Build unsigned IPA (签名交给全能签)
        script: |
          set -e
          cd ios/App
          # 用 build 而非 archive：archive 对“无签名”最挑剔，常瞬间失败产出空壳；
          # build 对未签名更宽容。CODE_SIGN_IDENTITY="-" 才是真正“不签名”，
          # 空字符串 "" 会被 Xcode 当成仍要签名 → 构建机无证书时瞬失败。
          xcodebuild -project App.xcodeproj -target App -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos"
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/App.app build/Payload/
          cd build && zip -r "$CM_EXPORT_DIR/tdxl-english-prep.ipa" Payload
    artifacts:
      - $CM_EXPORT_DIR/tdxl-english-prep.ipa
